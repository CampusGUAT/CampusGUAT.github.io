name: 内容纠错
description: 报告错误、失效链接或过期信息
title: '[纠错] '
labels: ['内容纠错']
body:
  - type: input
    id: page
    attributes:
      label: 页面链接
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 需要修正的内容
      description: 请说明原内容、建议修改和信息来源。
    validations:
      required: true
