<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">CampusGUAT</title>
  <desc id="desc">A calm blue-green CampusGUAT growth map for GUAT students</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="0.55" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#e8f7f1"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#49b8c8"/>
      <stop offset="1" stop-color="#78d6b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4b91a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" rx="96" fill="url(#bg)"/>
  <circle cx="820" cy="160" r="112" fill="#c9f0ec" opacity="0.58"/>
  <circle cx="158" cy="840" r="150" fill="#d9edff" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="76" y="92" width="848" height="816" rx="52" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#19384b">
    <text x="132" y="250" font-size="104" font-weight="800" letter-spacing="-4">Campus</text>
    <text x="132" y="380" font-size="124" font-weight="800" letter-spacing="-5" fill="#218da1">GUAT</text>
    <text x="138" y="445" font-size="25" font-weight="600" letter-spacing="4" fill="#5b8190">GROW · LEARN · BELONG</text>
  </g>

  <path d="M150 714 C260 600 330 760 454 626 S652 532 822 390" fill="none" stroke="#bfe9e6" stroke-width="30" stroke-linecap="round"/>
  <path d="M150 714 C260 600 330 760 454 626 S652 532 822 390" fill="none" stroke="url(#route)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>

  <g fill="#ffffff" stroke="#218da1" stroke-width="8">
    <circle cx="150" cy="714" r="25"/>
    <circle cx="454" cy="626" r="25"/>
    <circle cx="822" cy="390" r="25"/>
  </g>
  <g fill="#218da1">
    <circle cx="150" cy="714" r="8"/>
    <circle cx="454" cy="626" r="8"/>
    <circle cx="822" cy="390" r="8"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#467384">
    <text x="114" y="785">入学</text>
    <text x="415" y="690">成长</text>
    <text x="785" y="350">远方</text>
  </g>

  <path d="M760 165 l18 36 40 6-29 28 7 40-36-19-36 19 7-40-29-28 40-6z" fill="#73cdb4" opacity="0.9"/>
  <path d="M164 168h72M200 132v72" stroke="#5eb8cc" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
</svg>
